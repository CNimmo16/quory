name: quory-sakila

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sakila-root
      MYSQL_DATABASE: sakila
      MYSQL_USER: quory
      MYSQL_PASSWORD: quory
    ports:
      - "127.0.0.1:${SAKILA_PORT:-3307}:3306"
    volumes:
      - sakila-data:/var/lib/mysql
      - ./docker/sakila/01-schema.sql.gz:/docker-entrypoint-initdb.d/01-schema.sql.gz:ro
      - ./docker/sakila/02-data.sql.gz:/docker-entrypoint-initdb.d/02-data.sql.gz:ro
    healthcheck:
      # TCP stays unavailable until the entrypoint finishes importing both SQL files.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --database=sakila
          --execute='SELECT 1 FROM store LIMIT 1' > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sakila-data:
