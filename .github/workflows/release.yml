name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  npm:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
      contents: write # Changesets pushes tags and creates GitHub releases.
      pull-requests: write # Changesets opens and updates version PRs.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check download flow
        run: |
          node --test scripts/releases/check-npm-trust.test.cjs
          node --test packages/client/scripts/rebuild-native.test.mjs
          pnpm --filter @quory/marketing test:worker
          node --test scripts/downloads/release.test.mjs
          pnpm --filter @quory/marketing build

      - name: Check npm trusted publishing
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/releases/check-npm-trust.cjs')({ core });

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run ci:release
        # pnpm publishes through OIDC; do not create a legacy token .npmrc.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

  determine-client-version:
    needs: npm

    name: Determine client version

    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        id: getPublishedPackages
        env:
          PUBLISHED_PACKAGES: ${{needs.npm.outputs.publishedPackages}}
        with:
          result-encoding: string
          script: |
            const publishedPackages = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
            const clientPackage = publishedPackages.find((pkg) => pkg.name === '@quory/client');
            if (!clientPackage) {
              return '';
            }
            console.info(`Found published client version: ${clientPackage.version}`);
            return clientPackage.version;

    outputs:
      publishedClientVersion: ${{ steps.getPublishedPackages.outputs.result }}

  electron:
    needs: determine-client-version
    if: needs.determine-client-version.outputs.publishedClientVersion != ''
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode's Icon Composer asset runtime crashes on macOS 15 arm64.
          - os: macos-26
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          # node-gyp 10 supports VS 2022, not windows-latest's VS 2026.
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "@quory/client@${{ needs.determine-client-version.outputs.publishedClientVersion }}"
      - name: Select Xcode for native macOS icons
        if: matrix.platform == 'mac'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ needs.determine-client-version.outputs.publishedClientVersion }}
        run: node -e "if(require('./packages/client/package.json').version !== process.env.RELEASE_VERSION) process.exit(1)"
      - name: Build JS packages
        run: pnpm run build
      - name: Test native module preparation
        run: node --test packages/client/scripts/rebuild-native.test.mjs
      - name: Prepare Electron native modules
        working-directory: packages/client
        run: node scripts/prepare-electron.mjs
      - name: Package installers (no automatic publishing)
        working-directory: packages/client
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged runtime and native modules
        working-directory: packages/client
        run: node scripts/verify-package.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/client/dist/*.dmg
            packages/client/dist/*.exe
            packages/client/dist/*.AppImage
            packages/client/dist/*.deb

  desktop-downloads:
    name: Publish complete desktop download set
    needs: [determine-client-version, electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Validate complete set and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.determine-client-version.outputs.publishedClientVersion }}
        run: node scripts/downloads/release.mjs installers "$RELEASE_VERSION"
      - name: Attach installers and metadata to the desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.determine-client-version.outputs.publishedClientVersion }}
        run: gh release upload "@quory/client@$RELEASE_VERSION" installers/* --clobber
      - name: Promote the website manifest only after every upload succeeds
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = require('./installers/downloads.json');
            await require('./scripts/downloads/publish-manifest.cjs')({ github, context, manifest });
