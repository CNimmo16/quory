name: Marketing

on:
  push:
    branches: [main]
    paths:
      [
        "apps/marketing/**",
        "packages/config/**",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        ".github/workflows/marketing.yml",
      ]
  pull_request:
    paths:
      [
        "apps/marketing/**",
        "packages/config/**",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "package.json",
        ".github/workflows/marketing.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quory/marketing check:worker
      - run: pnpm --filter @quory/marketing test:worker
      - run: pnpm --filter @quory/marketing build
      - run: pnpm --filter @quory/marketing exec wrangler deploy --dry-run --env=""

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ format('https://{0}', vars.SITE_DOMAIN) }}
    concurrency:
      group: marketing-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare production configuration
        run: node apps/marketing/scripts/deployment-config.mjs
      - run: pnpm --filter @quory/marketing build
      - name: Inject and upload PostHog sourcemaps
        working-directory: apps/marketing
        env:
          POSTHOG_CLI_HOST: https://eu.posthog.com
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
        run: |
          pnpm exec posthog-cli sourcemap inject --directory dist --release-name quory-marketing --release-version "$GITHUB_SHA"
          pnpm exec posthog-cli sourcemap upload --directory dist --release-name quory-marketing --release-version "$GITHUB_SHA" --delete-after
      - name: Prepare Worker secrets
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const key = process.env.TURNSTILE_SECRET_KEY;
          if (!key || /^[123]x000/.test(key)) throw new Error('A production TURNSTILE_SECRET_KEY is required.');
          const resendKey = process.env.RESEND_API_KEY;
          if (!resendKey) throw new Error('A production RESEND_API_KEY is required.');
          writeFileSync(join(process.env.RUNNER_TEMP, 'marketing-secrets.json'), JSON.stringify({ TURNSTILE_SECRET_KEY: key, RESEND_API_KEY: resendKey }), { mode: 0o600 });
          JS
      - name: Apply production database migrations
        run: pnpm --filter @quory/marketing exec wrangler d1 migrations apply DB --remote --env production --config wrangler.deploy.json
      - name: Deploy production site and Worker
        run: pnpm --filter @quory/marketing exec wrangler deploy --env production --config wrangler.deploy.json --secrets-file "$RUNNER_TEMP/marketing-secrets.json"
      - name: Remove temporary secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/marketing-secrets.json"
