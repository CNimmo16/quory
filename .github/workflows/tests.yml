name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      # MySQL and Postgres integration tests start their own Docker containers.
      - name: Test workspace packages
        run: pnpm test
      - name: Test marketing libraries and Worker
        run: pnpm --filter @quory/marketing test:worker
      - name: Test release and native module scripts
        run: >-
          node --test
          scripts/releases/check-npm-trust.test.cjs
          scripts/downloads/release.test.mjs
          scripts/downloads/select-release.test.cjs
          packages/client/scripts/rebuild-native.test.mjs
